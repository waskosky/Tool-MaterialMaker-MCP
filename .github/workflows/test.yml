name: review-release-contracts
on:
  push:
    branches: [main, integration/next]
  pull_request:
  workflow_dispatch:
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_release.py -m "not browser and not native" --junitxml=contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-${{ matrix.os }}
          path: contracts.xml
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[release]"
      - run: python scripts/build_distribution.py
      - run: python -m twine check dist/*
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      # Real loopback HTTP/auth/CSP and WebGL; material PNGs come from TestRenderer.
      - name: Authenticated browser workflow with required WebGL and synthetic TestRenderer maps
        shell: bash
        env:
          MM_REQUIRE_WEBGL_TEST: '1'
          MM_BROWSER_EVIDENCE: browser-evidence/workshop-desktop-TestRenderer.png
          MM_MOBILE_BROWSER_EVIDENCE: browser-evidence/workshop-mobile-TestRenderer.png
          MM_SETUP_BROWSER_EVIDENCE: browser-evidence/workshop-setup-TestRenderer.png
          MM_HOSTED_ENTRY_BROWSER_EVIDENCE: browser-evidence/workshop-slashless-entry.png
        run: |
          mkdir -p browser-evidence
          MM_TEST_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export MM_TEST_CHROMIUM
          python -m pytest tests/upgrade/test_browser.py tests/upgrade/test_browser_hosting.py -q --junitxml=browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-TestRenderer-evidence
          path: |
            browser.xml
            browser-evidence/*.png
  vector-compiler-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Read independently reviewed RAI compiler pin
        id: pin
        shell: bash
        run: |
          python - <<'PY'
          import os
          from mm_mcp.vector.provenance import verify
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + verify()['source_revision'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: waskosky/rai
          ref: ${{ steps.pin.outputs.revision }}
          ssh-key: ${{ secrets.RAI_VECTOR_SOURCE_KEY }}
          persist-credentials: false
          path: paired-rai
      - run: python scripts/check_vector_compiler.py --rai-root paired-rai
